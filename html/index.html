<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Neon Models — Home</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <div class="brand">
          <div class="logo">NEON MODELS</div>
          <div class="pill">3D Marketplace</div>
        </div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="marketplace.html">Marketplace</a>
          <a href="auth.html">Log In</a>
        </nav>
      </header>

      <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
          <div class="hero-left">
            <h1 class="hero-title">NEON MODELS — Premium 3D Assets</h1>
            <p class="hero-sub">Premium neon-lit models, Rockstar-inspired UI — buy or download the best assets for your projects.</p>
            <a class="cta" href="marketplace.html">Explore Marketplace</a>
          </div>

          <div class="hero-visual" aria-hidden="true" style="min-height:220px;display:flex;align-items:center;justify-content:center">
            <div style="width:100%;height:220px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--cyan));opacity:0.06"></div>
          </div>
        </div>
      </section>
      <!-- Hero model modal -->
      <div id="heroModelModal" class="modal" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
          <button class="modal-close" aria-label="Close">✕</button>
          <div class="modal-body" id="heroModelContainer"></div>
        </div>
      </div>

      <section style="margin-top:18px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">Featured Models</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="searchMain" class="input glow-outline" style="width:220px" placeholder="Search models...">
          </div>
        </div>
        <div class="scroll-wrap" style="margin-top:12px">
          <div id="featuredRow" class="scroll-content" style="display:flex;gap:12px;overflow:auto;padding-bottom:6px"></div>
          <div class="h-scrollbar" data-target="featuredRow" aria-hidden="true"><div class="h-thumb"></div></div>
        </div>
        <div class="scroll-wrap" style="margin-top:12px">
          <div id="featuredRow2" class="scroll-content" style="display:flex;gap:12px;overflow:auto;padding-bottom:6px"></div>
          <div class="h-scrollbar" data-target="featuredRow2" aria-hidden="true"><div class="h-thumb"></div></div>
        </div>
      </section>
    </div>

    <script src="../js/app.js"></script>
    <script>initHome()</script>
  </body>
</html>
